name: Record game trailer scenes

on:
  workflow_dispatch:
  push:
    paths:
      - 'game.js'
      - 'index.html'
      - 'tests/trailer.spec.js'
      - 'playwright.config.js'
      - '.github/workflows/record-trailer.yml'

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p screenshots && python3 -m http.server 4173 >/tmp/holy-server.log 2>&1 &
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: holy-trailer-scenes
          path: |
            test-results
            screenshots
          retention-days: 7
